name: Fetch assets from Squarespace (one-time)
on:
  workflow_dispatch:
  push:
    paths: [assets.json, fetch_assets.py, .github/workflows/fetch-assets.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_assets.py
      - name: Commit downloaded assets
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images files
          git diff --cached --quiet || (git commit -m "Add images and PDFs from old Squarespace site" && git push)
